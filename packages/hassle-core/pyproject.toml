[project]
name = "hassle-core"
version = "0.0.0"
description = "Hassle core: IR, compiler, decompiler, validator, simulator, sync engine."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hassle_core"]
