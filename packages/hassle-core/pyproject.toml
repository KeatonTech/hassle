[project]
name = "hassle-core"
version = "0.0.0"
description = "Hassle core: IR, compiler, decompiler, validator, simulator, sync engine."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "jinja2>=3.1",
]

[project.entry-points.pytest11]
# Registers the `sim` fixture (hassle.testing.plugin) so plain `pytest` picks
# it up automatically once hassle-core is installed (DESIGN §10.2).
hassle = "hassle.testing.plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Exactly one top-level import package ships in this distribution: `hassle`
# (owner decision, 2026-07-03 — previously two packages, `hassle_core` +
# `hassle`; `hassle_core` was merged into `hassle` and deleted). The
# distribution name stays `hassle-core`; only the import package changed.
[tool.hatch.build.targets.wheel]
packages = ["src/hassle"]
