[project]
name = "hassle-core"
version = "0.0.0"
description = "Hassle core: IR, compiler, decompiler, validator, simulator, sync engine."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Two top-level packages ship in this one distribution: `hassle_core` (the
# machinery) and `hassle` (the user-facing DSL import surface, DESIGN §5.3 / M1).
[tool.hatch.build.targets.wheel]
packages = ["src/hassle_core", "src/hassle"]
