[project]
name = "hassle-core"
version = "0.0.0"
description = "Hassle core: IR, compiler, decompiler, validator, simulator, sync engine."
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "jinja2>=3.1",
    "libcst>=1.4",
    "aiohttp>=3.9",
    # Runtime dependency, not just dev tooling: the decompiler formats every
    # generated file by shelling out to the ruff binary (codegen._format_with_ruff).
    "ruff>=0.4",
    "python-slugify>=8",
    # The simulator reads bundle-local blueprint sources, which are YAML
    # carrying HA's `!input` custom tag (`hassle.blueprints`).
    # Read-only and offline; Hassle still never WRITES a YAML file behind
    # HA's back (DESIGN §2).
    "pyyaml>=6",
]

[project.entry-points.pytest11]
# Registers the `sim` fixture (hassle.testing.plugin) so plain `pytest` picks
# it up automatically once hassle-core is installed (DESIGN §10.2).
hassle = "hassle.testing.plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Exactly one top-level import package ships in this distribution: `hassle`.
# The distribution name stays `hassle-core`; only the import package name
# differs from it.
[tool.hatch.build.targets.wheel]
packages = ["src/hassle"]
