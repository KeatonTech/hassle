[project]
name = "hassle-dev"
version = "0.0.0"
description = "Hassle internal dev CLI: goldens, corpus-stats."
requires-python = ">=3.12"
dependencies = [
    "hassle-core",
    "hassle-cli",
]

[project.scripts]
hassle-dev = "hassle_dev.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hassle_dev"]
