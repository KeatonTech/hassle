[project]
name = "hassle-cli"
version = "0.0.0"
description = "Hassle CLI: pull/plan/push/validate/test/run/fmt/stubs/explain/mirror/doctor."
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "click>=8.4.2",
    "hassle-core",
    "keyring>=25.7.0",
    "rich>=15.0.0",
]

[project.scripts]
hassle = "hassle_cli.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hassle_cli"]
