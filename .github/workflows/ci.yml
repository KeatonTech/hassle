name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.26"

jobs:
  ci:
    name: lint · typecheck · unit · corpus
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS + Linux are the two target platforms (MILESTONES M7).
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync workspace
        run: uv sync --frozen

      - name: Ruff format (check)
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Pyright (strict on hassle-core)
        run: uv run pyright

      - name: Unit tests (no network; integration excluded)
        run: uv run pytest -m "not integration"

      - name: Corpus contract (>= 40 fixtures, all constructs)
        run: uv run hassle-dev corpus-stats

      - name: Goldens unchanged
        run: uv run hassle-dev goldens

      - name: Decompiler DSL-coverage gate (>= 90%, M2)
        run: uv run hassle-dev decompile-coverage --out decompile-coverage.json

      - name: Upload decompiler coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decompile-coverage-${{ matrix.os }}
          path: decompile-coverage.json

      - name: Docs gate (docs/DSL.md + docs/COOKBOOK.md unchanged, MILESTONES M9)
        run: uv run hassle-dev docs

  # ---------------------------------------------------------------------------
  # M6 integration: the same integration-marked suite against real Home
  # Assistant, on both the `stable` and `dev` images (MILESTONES M6 "Done
  # when"). Docker (blocked in the M0.V sandbox) runs here; the tests target any
  # instance via HASSLE_TEST_HA_URL / HASSLE_TEST_HA_TOKEN, so this is the same
  # suite a developer runs against a local pip-installed HA.
  #
  # M7 extends this job (not a new one): `packages/hassle-cli/tests/integration`
  # is the ONE `run --live` test (MILESTONES M7 test 5), gated the same way and
  # run in the same step so it shares the already-running HA container.
  # ---------------------------------------------------------------------------
  integration:
    name: integration · HA ${{ matrix.ha_tag }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ha_tag: [stable, dev]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync workspace
        run: uv sync --frozen

      - name: Write HA config (standard includes + helper domains + media)
        run: |
          mkdir -p ha-config/media/hassle
          cat > ha-config/configuration.yaml <<'YAML'
          default_config:
          automation: !include automations.yaml
          script: !include scripts.yaml
          input_boolean:
          input_number:
          input_select:
          input_text:
          input_datetime:
          input_button:
          counter:
          timer:
          schedule:
          media_source:
          logger:
            default: warning
          YAML
          echo "[]" > ha-config/automations.yaml
          echo "{}" > ha-config/scripts.yaml
          # M10 assumption (unverified in this sandbox, no Docker -- CI is the
          # authoritative check, docs/ha-api-notes.md §26.0): `template:` is a
          # config-entry-capable integration, and HA generally registers a
          # `config_flow: true` integration's config_entries/flow handler from
          # its manifest regardless of YAML config presence, so no
          # configuration.yaml stanza should be needed for M10's tests to reach
          # `config_entries/flow/create(handler="template")`. If the M10
          # integration job fails with "unknown handler" / "integration not
          # found", add a bare `template:` key here and update
          # docs/ha-api-notes.md §26.0 with the correction.

      - name: Start Home Assistant (${{ matrix.ha_tag }})
        run: |
          docker run -d --name ha -p 8123:8123 \
            -v "${{ github.workspace }}/ha-config:/config" \
            ghcr.io/home-assistant/home-assistant:${{ matrix.ha_tag }}

      - name: Onboard HA and mint a long-lived token
        run: |
          uv run python .github/scripts/onboard_ha.py ha_token.txt http://localhost:8123 \
            | grep '^HASSLE_TEST_HA_TOKEN=' >> "$GITHUB_ENV"

      - name: Integration tests (real HA)
        env:
          HASSLE_TEST_HA_URL: http://localhost:8123
        run: |
          uv run pytest -m integration \
            packages/hassle-core/tests/integration \
            packages/hassle-cli/tests/integration \
            -v

      - name: HA logs on failure
        if: failure()
        run: docker logs ha || true
