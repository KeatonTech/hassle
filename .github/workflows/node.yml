name: vscode-extension

on:
  push:
    branches: [main]
    paths:
      - "vscode-extension/**"
      - ".github/workflows/node.yml"
  pull_request:
    paths:
      - "vscode-extension/**"
      - ".github/workflows/node.yml"

concurrency:
  group: node-${{ github.ref }}
  cancel-in-progress: true

# Kept off the Python matrix in `.github/workflows/ci.yml` -- the extension
# is a wholly separate TypeScript project (`vscode-extension/`)
# with its own toolchain, dependency lockfile, and release artifact (a
# `.vsix`, never published from CI); it has nothing to do with the
# `hassle`/`hassle-cli` Python package matrix.
# Least privilege: nothing here needs to write to the repository.
permissions:
  contents: read

jobs:
  unit:
    name: unit tests (no VS Code needed)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: tsc --noEmit (strict)
        run: npx tsc --noEmit -p .

      - name: Unit tests (mocked CLI subprocess, no VS Code)
        run: npm run test:unit

  integration:
    name: "@vscode/test-electron (headless)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      # At least one @vscode/test-electron run must execute
      # headless in CI -- `xvfb-run` provides the virtual X display VS
      # Code's Electron shell needs on a headless Linux runner.
      - name: Integration tests (real Extension Host, headless)
        run: xvfb-run -a npm run test:integration
