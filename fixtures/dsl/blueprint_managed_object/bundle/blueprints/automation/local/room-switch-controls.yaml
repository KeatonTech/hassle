blueprint:
  name: Room switch controls
  description: One paddle switch drives one room light.
  domain: automation
  input:
    switch_entity:
      name: Switch
      description: The paddle switch entity.
      selector:
        entity:
          filter:
            - domain: sensor
    room_light:
      name: Room light
      selector:
        entity:
          filter:
            - domain: light
    dim_step_pct:
      name: Dim step
      default: 10

mode: restart
triggers:
  - trigger: state
    entity_id: !input switch_entity
    to: "up"
    id: up
actions:
  - action: light.turn_on
    target:
      entity_id: !input room_light
    data:
      brightness_step_pct: !input dim_step_pct
