[project]
name = "hassle"
version = "0.0.0"
description = "Hassle monorepo workspace root"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
hassle-core = { workspace = true }
hassle-cli = { workspace = true }
hassle-dev = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "libcst>=1.4",
    "hypothesis>=6.100",
    "hassle-core",
    "hassle-cli",
    "hassle-dev",
]

# ---------------------------------------------------------------------------
# Shared tool configuration (applies across the whole workspace)
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/hassle-core/src", "packages/hassle-cli/src", "packages/hassle-dev/src"]
# `new_middle_def.py` is a single-object *splice fragment* (M2 test fixture) --
# a replacement body meant to be spliced into an existing file that already
# carries the imports, not a standalone importable bundle (unlike every real
# fixtures/dsl/*/bundle/*.py, which import from `hassle` and lint clean).
extend-exclude = ["fixtures/splice/three_automations/new_middle_def.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# `field_default(...)` (MILESTONES M19, owner-directed typing resolution) is
# the identity function AT RUNTIME -- it returns its argument completely
# unchanged, so reusing the single value computed once at function-definition
# time (B008's actual concern: a MUTABLE default shared/mutated across calls)
# is exactly as safe as a plain literal default would be. It exists purely to
# give a `@shared_script` parameter's default expression a `TemplateExpr`
# return type for pyright (the def's own body-true annotation), a role B008
# doesn't have a structural way to recognize (its own "immutable type
# annotation" exemption doesn't apply -- `TemplateExpr` is `hassle`-internal,
# unknown to ruff) -- so it is named here explicitly, the documented escape
# hatch for exactly this shape (flake8-bugbear's own docs cite `Depends()`-
# style sentinel calls as the canonical use case).
extend-immutable-calls = ["hassle.field_default", "hassle.compiler.scripts.field_default"]

[tool.pyright]
# Frozen rule (CLAUDE.md / R7): pyright --strict on hassle-core.
include = ["packages/hassle-core/src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["packages/hassle-core/tests", "packages/hassle-dev/tests", "packages/hassle-cli/tests"]
addopts = "-ra"
markers = [
    "integration: tests that talk to a real Dockerized HA (M6+); never run in unit CI",
    "hassle_bundle(path): M4 simulator tests -- bundle directory the `sim` fixture compiles",
]
